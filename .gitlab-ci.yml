default:
  tags:
    - docker

stages:
  - set-variable
  - build
  - push

include:
  - project: "devops/gitlab-cicd-templates"
    ref: "master"
    file: "/build-docker.gitlab-ci.yml"

variables:
  BASE_PROJECT_NAME: "relay"

build-docker:
  extends: .build-docker

push-docker:
  extends: .push-docker
